# ==============================================================================
# GitHub Actions — 推送到 main 即部署到 Cloudflare Worker
#
# 一次性 Secret(Settings → Secrets and variables → Actions):
#   CF_API_TOKEN / CF_ACCOUNT_ID  —— Cloudflare 部署凭据(原有)
#   GH_PAT                        —— 读取私有包 @ivanphz/workdays-core(新增, 见 INTEGRATION §2.2)
#
# ⚠️ 家庭日历 CALENDAR_URLS 是【Worker Secret】(在 Cloudflare 那边, `wrangler secret put` 配一次),
#    不是 GitHub Secret, 本工作流不涉及、部署也不会动它。
# ==============================================================================

name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
    # 只有【会影响运行结果】的改动才部署。改文档不该触发部署 ——
    # 既浪费额度，又会把一份内容完全相同的代码重新推上去。
    paths:
      - "src/**"
      - "test/**"          # 测试挂了要拦住部署（见下方 test 步骤）
      - "package*.json"
      - "wrangler.toml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node(带 GitHub Packages 私有源)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://npm.pkg.github.com'
          scope: '@ivanphz'

      - name: 安装依赖(workdays-core 从私有源拉取)
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PAT }}

      # ⚠️ 先跑测试再部署。Ivan 只用 GitHub 网页开发、没有本地环境，
      #    这里是【唯一】会执行 npm test 的地方 —— 少了它，194 个用例等于不存在。
      - name: 跑测试（失败则不部署）
        run: npm test

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: "4"
          # wrangler(esbuild)会自动把 node_modules 里 import 到的包打进 bundle
