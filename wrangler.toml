# ==============================================================================
# Smart Schedule Gateway — Cloudflare Worker 部署配置
# 部署命令: npx wrangler deploy
# ==============================================================================
name = "ios-alarm-api"
main = "src/index.js"
compatibility_date = "2026-01-01"
keep_vars = true

# 步骤⑤ AI 额度试点需要（先在 CF 面板建命名空间再取消注释）
# [[kv_namespaces]]
# binding = "FACTS_KV"
# id = "<namespace id>"

# ==============================================================================
# 🔔 门铃扫描（原子化第④步）
#   服务端平时只被动响应请求；主动性全靠这个 cron。
#   每 N 分钟扫一次「没有刺客覆盖的边界」，有就推一条 Bark active 门铃。
#   门铃延迟 = 0 ~ 一个 cron 间隔。免费额度 100,000 请求/天，怎么调都够:
#     */5 * * * *  → 288 次/天 (0.3%)，延迟 ≤5 分钟   ← 当前
#     * * * * *    → 1440 次/天 (1.4%)，延迟 ≤60 秒
#   ⚠️ 间隔改这里要【同步改】config 的 PUSH.SWEEP_MINUTES，两者必须一致否则漏扫或重扫。
#   Bark key 用 secret 注入: npx wrangler secret put BARK_KEY
# ==============================================================================
[triggers]
crons = ["*/5 * * * *"]
